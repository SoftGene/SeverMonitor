services:
  postgres:
    image: postgres:17
    container_name: servermonitor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor_dev_password
      POSTGRES_DB: servermonitor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: